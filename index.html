<!DOCTYPE html>
<html>
    <head>
        <title>Roman Numeral Converter</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Cinzel&display=swap" rel="stylesheet">
    </head>

    <body>
        <h1>Roman Numeral Converter</h1>
            <form id="converter-form">
                <label for="number">Enter an integer</label>
                <div id="error-message-box">
                    <div id="error-message"></div>
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress-fill" id="completion-bar"></div>
                    </div>
                </div>
                <input id="number" name="number" placeholder="1–3999" required>
                <button type="submit">Convert</button>
            </form>
        <h2 id="roman-numeral">--</h2>

    <script src="to_roman_converter.js"></script>
    </body>
</html>
